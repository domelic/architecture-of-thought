name: Amazon KDP Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v3.0.0)'
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  build-epub:
    runs-on: ubuntu-latest
    outputs:
      epub_name: ${{ steps.build.outputs.epub_name }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.event.release.tag_name }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Install Pandoc and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended

      - name: Install epubcheck
        run: |
          EPUBCHECK_VERSION="5.1.0"
          wget -q "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          unzip -q "epubcheck-${EPUBCHECK_VERSION}.zip"
          echo "EPUBCHECK_JAR=$(pwd)/epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar" >> $GITHUB_ENV

      - name: Build EPUB
        id: build
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          EPUB_NAME="THE_ARCHITECTURE_OF_THOUGHT_${VERSION}.epub"

          # Build pandoc command with optional arguments
          PANDOC_ARGS="--toc --toc-depth=2"
          PANDOC_ARGS="$PANDOC_ARGS --metadata title=\"The Architecture of Thought\""
          PANDOC_ARGS="$PANDOC_ARGS --metadata subtitle=\"The Dialectical Cognition Framework\""
          PANDOC_ARGS="$PANDOC_ARGS --metadata author=\"Damir Omelic\""
          PANDOC_ARGS="$PANDOC_ARGS --metadata date=\"$(date +%Y)\""
          PANDOC_ARGS="$PANDOC_ARGS --metadata lang=en"

          # Add cover image if it exists (check for jpg, jpeg, or png)
          COVER_IMAGE=""
          for ext in jpg jpeg png; do
            if [ -f "cover.$ext" ]; then
              COVER_IMAGE="cover.$ext"
              break
            fi
          done

          if [ -n "$COVER_IMAGE" ]; then
            echo "Found $COVER_IMAGE, including in EPUB"
            PANDOC_ARGS="$PANDOC_ARGS --epub-cover-image=$COVER_IMAGE"
          else
            echo "No cover image found, building EPUB without cover"
          fi

          # Add bibliography if it exists
          if [ -f "references.bib" ]; then
            echo "Found references.bib, including citations"
            PANDOC_ARGS="$PANDOC_ARGS --bibliography=references.bib --citeproc"
          fi

          # Build EPUB using Pandoc
          echo "Running: pandoc THE_ARCHITECTURE_OF_THOUGHT.tex -o ${EPUB_NAME} $PANDOC_ARGS"
          eval pandoc THE_ARCHITECTURE_OF_THOUGHT.tex -o "${EPUB_NAME}" $PANDOC_ARGS

          # Verify EPUB was created
          if [ -f "${EPUB_NAME}" ]; then
            echo "EPUB created successfully: ${EPUB_NAME}"
            echo "epub_name=${EPUB_NAME}" >> $GITHUB_OUTPUT
            ls -la "${EPUB_NAME}"
          else
            echo "Error: EPUB file not created"
            exit 1
          fi

      - name: Validate EPUB
        run: |
          echo "Validating EPUB with epubcheck..."
          java -jar "$EPUBCHECK_JAR" "${{ steps.build.outputs.epub_name }}" 2>&1 | tee epubcheck-output.txt

          # Check for fatal errors (fail build)
          if grep -q "^FATAL" epubcheck-output.txt; then
            echo "::error::EPUB validation failed with fatal errors"
            exit 1
          fi

          # Report regular errors as warnings (Pandoc output commonly has minor issues)
          if grep -q "^ERROR" epubcheck-output.txt; then
            echo "::warning::EPUB has validation errors (non-fatal, may affect some readers)"
            grep "^ERROR" epubcheck-output.txt | head -5
          fi

          echo "EPUB validation completed"

      - name: Upload EPUB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: epub-${{ steps.version.outputs.version }}
          path: ${{ steps.build.outputs.epub_name }}
          retention-days: 90

      - name: Upload EPUB to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.build.outputs.epub_name }}" \
            --clobber

  create-kdp-issue:
    needs: build-epub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create KDP upload issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-epub.outputs.version }}
          EPUB_NAME: ${{ needs.build-epub.outputs.epub_name }}
        run: |
          # Check if issue already exists
          EXISTING=$(gh issue list --label "amazon-kdp" --state open --json number --jq length)
          if [ "$EXISTING" -gt "0" ]; then
            echo "KDP upload issue already exists, skipping creation"
            exit 0
          fi

          # Create issue body file
          cat > /tmp/issue-body.md << 'ISSUE_EOF'
          ## Amazon KDP Upload Required

          A new release has been published and the EPUB has been built.

          ### Download EPUB

          Download from the GitHub release assets or Actions artifacts.

          ### Upload Checklist

          - [ ] Download the EPUB file from the release
          - [ ] Log in to [KDP](https://kdp.amazon.com)
          - [ ] Navigate to your book's Kindle eBook Content
          - [ ] Upload the new EPUB file
          - [ ] Review the preview in Kindle Previewer
          - [ ] Update the version number in book details if needed
          - [ ] Save and publish changes
          - [ ] Wait for Amazon review (24-72 hours)

          ### Book Details

          | Field | Value |
          |-------|-------|
          | Title | The Architecture of Thought |
          | Subtitle | The Dialectical Cognition Framework |
          | Author | Damir Omelic |

          ### After Publishing

          - [ ] Verify the update is live on Amazon
          - [ ] Close this issue

          ---
          *This issue was automatically created by the Amazon KDP Publish workflow.*
          ISSUE_EOF

          gh issue create \
            --title "Amazon KDP: Upload ${VERSION}" \
            --label "amazon-kdp" \
            --body-file /tmp/issue-body.md
