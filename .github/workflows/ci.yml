name: CI

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '**.tex'
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at midnight UTC (for link checker)
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  commitlint:
    name: Lint Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install commitlint
        run: npm install --save-dev @commitlint/cli @commitlint/config-conventional

      - name: Validate PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  markdown-lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v24.1.0
        with:
          config: '.markdownlint.json'
          globs: |
            **/*.md
            !CHANGELOG.md

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install cspell
        run: npm install -g cspell

      - name: Run spell check
        run: cspell --config .cspell.json "**/*.md" --no-progress

  link-checker:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check links with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 100..=103,200..=299,403,429
            --exclude "^https://doi.org/"
            --exclude "^https://zenodo.org/badge/"
            --exclude "^https://www.amazon.com/kindlepreviewer"
            --exclude "localhost"
            --exclude "127.0.0.1"
            --exclude "AMAZON_KDP_CONTENT.md"
            --exclude "AMAZON_PUBLISHING_GUIDE.md"
            --exclude "\\[Definition\\]"
            --exclude "DCF_CASE_STUDY_TEMPLATE.md"
            --exclude "^https://github.com/domelic/architecture-of-thought/compare/"
            '**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Issue on Failure
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Link Checker: Broken links detected"
          content-filepath: ./lychee/out.md
          labels: bug, automated
