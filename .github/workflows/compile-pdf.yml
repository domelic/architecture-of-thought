name: Compile PDF

on:
  push:
    branches: [main]
    paths:
      - '**.tex'
      - '**.bib'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: THE_ARCHITECTURE_OF_THOUGHT.tex
          latexmk_use_xelatex: false
          latexmk_shell_escape: false
          extra_system_packages: "biber"

      - name: Check PDF was created
        run: |
          if [ -f "THE_ARCHITECTURE_OF_THOUGHT.pdf" ]; then
            echo "PDF compiled successfully"
            ls -la THE_ARCHITECTURE_OF_THOUGHT.pdf
          else
            echo "PDF compilation failed"
            exit 1
          fi

      - name: Extract and update page count
        id: pagecount
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          PAGE_COUNT=$(pdfinfo THE_ARCHITECTURE_OF_THOUGHT.pdf | grep "Pages:" | awk '{print $2}')
          echo "Detected page count: $PAGE_COUNT"
          echo "page_count=$PAGE_COUNT" >> $GITHUB_OUTPUT

          if [ -z "$PAGE_COUNT" ]; then
            echo "Could not extract page count, skipping update"
            exit 0
          fi

          # Update README.md
          sed -i "s/Pages-[0-9]*-blue/Pages-${PAGE_COUNT}-blue/g" README.md
          sed -i "s/PDF ([0-9]* pages)/PDF (${PAGE_COUNT} pages)/g" README.md
          sed -i "s/Compiled document ([0-9]* pages)/Compiled document (${PAGE_COUNT} pages)/g" README.md

          # Update CLAUDE.md
          sed -i "s/[0-9]*-page LaTeX document/${PAGE_COUNT}-page LaTeX document/g" CLAUDE.md
          sed -i "s/([0-9]* pages,/(${PAGE_COUNT} pages,/g" CLAUDE.md

          # Update resources/DCF_SLIDE_DECK.md if it exists
          if [ -f "resources/DCF_SLIDE_DECK.md" ]; then
            sed -i "s/([0-9]* pages)/(${PAGE_COUNT} pages)/g" resources/DCF_SLIDE_DECK.md
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-compile PDF and update page count"
          title: "chore: auto-compile PDF (${{ steps.pagecount.outputs.page_count }} pages)"
          body: |
            Automated PDF compilation triggered by changes to `.tex` or `.bib` files.

            - Compiled PDF updated
            - Page count updated to ${{ steps.pagecount.outputs.page_count }} pages

            This PR was automatically generated by the Compile PDF workflow.
          branch: auto/compile-pdf
          delete-branch: true
          labels: automated
